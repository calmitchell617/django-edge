[project]
name = "django-edge-reference"
version = "0.1.0"
description = "Django on Workers: PostgreSQL with an eventually consistent D1 relational cache"
requires-python = ">=3.14"
dependencies = [
  "django>=5.2.8,<5.3",
  "django-cf",
  "django-pgtrigger>=4.17,<5",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2",
  "workers-runtime-sdk",
]

[dependency-groups]
dev = ["workers-py", "pytest>=8", "httpx>=0.28", "ruff>=0.12"]

[tool.uv.sources]
django-cf = { path = "../workers-py/packages/django-cf" }
workers-py = { path = "../workers-py/packages/cli" }
workers-runtime-sdk = { path = "../workers-py/packages/runtime-sdk", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
