 <title>D1 as a relational cache for Django</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>D1 as a relational cache for Django</dc:title>
    <dc:date>2026-10-19T10:27:59.292716</dc:date>
    <dc:description>Django queries PostgreSQL for authoritative reads and writes, and D1 for opted-in reads. A Durable Object mirrors pending PostgreSQL rows to D1's primary, which replicates asynchronously to Oceania.</dc:description>
